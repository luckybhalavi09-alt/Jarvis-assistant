<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .jarvis-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(102, 126, 234, 0);
            }
        }

        .chat-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.user .text {
            background: #667eea;
            color: white;
            padding: 12px 16px;
            border-radius: 18px 18px 4px 18px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.assistant .text {
            background: #e9ecef;
            color: #333;
            padding: 12px 16px;
            border-radius: 18px 18px 18px 4px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .timestamp {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
            min-width: 120px;
        }

        .btn-voice {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-voice:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-send {
            background: #28a745;
            color: white;
        }

        .btn-send:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #dc3545;
            color: white;
            flex: 0;
        }

        .btn-clear:hover {
            background: #c82333;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            min-height: 20px;
        }

        .status.listening {
            background: #fff3cd;
            color: #856404;
            animation: blink 1s infinite;
        }

        .status.processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
        }

        .info-box h4 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .info-box ul {
            margin-left: 20px;
        }

        .info-box li {
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .chat-display {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="jarvis-avatar">🤖</div>
            <h1>Jarvis</h1>
            <p>Your Personal AI Assistant</p>
        </div>

        <div class="status" id="status"></div>

        <div class="chat-display" id="chatDisplay"></div>

        <div class="input-section">
            <input type="text" id="userInput" placeholder="Type your command or question..." />
        </div>

        <div class="button-group">
            <button class="btn-voice" id="voiceBtn" onclick="startVoiceInput()">
                🎤 Voice Input
            </button>
            <button class="btn-send" id="sendBtn" onclick="sendTextInput()">
                📤 Send
            </button>
            <button class="btn-clear" id="clearBtn" onclick="clearChat()">
                🗑️ Clear
            </button>
        </div>

        <div class="info-box">
            <h4>💡 Try saying:</h4>
            <ul>
                <li>"What time is it?"</li>
                <li>"What's today's date?"</li>
                <li>"Open YouTube"</li>
                <li>"Search for Python"</li>
                <li>"Hello Jarvis"</li>
            </ul>
        </div>
    </div>

    <script>
        const chatDisplay = document.getElementById('chatDisplay');
        const userInput = document.getElementById('userInput');
        const voiceBtn = document.getElementById('voiceBtn');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender;
            messageDiv.innerHTML = `
                <div class="text">${escapeHtml(text)}</div>
                <div class="timestamp">${new Date().toLocaleTimeString()}</div>
            `;
            chatDisplay.appendChild(messageDiv);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function startVoiceInput() {
            updateStatus('🎤 Listening... (speak now)', 'listening');
            voiceBtn.disabled = true;
            sendBtn.disabled = true;

            fetch('/voice-input', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addMessage(data.recognized, 'user');
                    updateStatus('Processing...', 'processing');
                    addMessage(data.response, 'assistant');
                    updateStatus('', '');
                    
                    fetch('/speak', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: data.response })
                    });
                } else {
                    updateStatus('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                updateStatus('Error: ' + error.message, 'error');
            })
            .finally(() => {
                voiceBtn.disabled = false;
                sendBtn.disabled = false;
            });
        }

        function sendTextInput() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            updateStatus('Processing...', 'processing');

            fetch('/text-input', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addMessage(data.response, 'assistant');
                    updateStatus('✓ Response received', 'success');
                    
                    fetch('/speak', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: data.response })
                    });
                } else {
                    updateStatus('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                updateStatus('Error: ' + error.message, 'error');
            });
        }

        function clearChat() {
            chatDisplay.innerHTML = '';
            updateStatus('', '');
        }

        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendTextInput();
            }
        });

        window.addEventListener('load', function() {
            addMessage("Hello! I'm Jarvis, your AI assistant. How can I help you today?", 'assistant');
        });
    </script>
</body>
</html>
